    <!-- Critical CSS Inlined for instant above-the-fold HeroSection paint (0 render-blocking CSS) -->
    <style id="critical-hero-css">
      @layer theme, base, components, utilities;
      @layer base {
        *,::before,::after{box-sizing:border-box}
        html{background-color:#08070b;color:rgba(255,255,255,.92);font-family:"Plus Jakarta Sans",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;scroll-behavior:smooth;overflow-x:hidden}
        body{margin:0;background-color:#08070b;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      }
      @layer components {
        .hero-section{width:100%;padding-top:1.5rem;padding-bottom:1.75rem}
        .hero-inner{margin-inline:auto;max-width:520px;padding-inline:1.25rem}
        .hero-h1{margin:0;text-align:center;text-wrap:balance;font-family:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;line-height:1.13;letter-spacing:-.01em;color:#fff}
        .hero-gold{color:#f5b82e}
        .hero-nowrap{white-space:nowrap}
        .hero-sub{margin-top:.875rem;text-align:center}
        .hero-sub p{margin:0}
        .hero-mark{display:inline-block;border-radius:3px;background-color:#e12687;padding:3px 10px;font-family:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;font-size:13px;font-weight:800;line-height:1.25;letter-spacing:.01em;color:#fff}
        .hero-sub-copy{margin-top:.625rem!important;text-wrap:balance;font-size:14.5px;font-weight:600;text-transform:uppercase;line-height:1.45;color:rgba(255,255,255,.85)}
        .hero-sub-accent{font-weight:700;color:#f5b82e;white-space:nowrap}
        .hero-art-wrap{margin-inline:auto;margin-top:1.25rem;max-width:380px}
        .hero-artwork-frame{border-radius:26px;padding:2.5px;background:linear-gradient(135deg,#e12687 0%,#8b2cf5 50%,#f5b82e 100%);box-shadow:0 24px 64px -24px rgba(225,38,135,.35)}
        .hero-art-inner{overflow:hidden;border-radius:23.5px;background-color:#0b0a10}
        .hero-art-img{display:block;aspect-ratio:1/1;width:100%;height:auto;object-fit:cover}
        .hero-cta-wrap{margin-top:1.25rem}
        .hero-cta{width:100%;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:1rem;padding:1rem;font-family:"Outfit","Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:12px;color:#fff;text-decoration:none;white-space:nowrap;background-color:#e12687;border:1px solid rgba(255,255,255,.15);box-shadow:0 12px 28px -10px rgba(225,38,135,.55);transition:background-color 150ms ease-out,transform 150ms ease-out}
        .hero-cta:hover{background-color:#ee3594}
        .hero-cta:active{transform:scale(.985)}
        .hero-cta-icon{width:1rem;height:1rem;flex-shrink:0;transition:transform 150ms ease-out}
        .hero-cta:hover .hero-cta-icon{transform:translateY(2px)}
        @media (min-width:400px){.hero-h1{font-size:28px}.hero-cta{font-size:13px}}
        @media (min-width:640px){.hero-section{padding-top:2.25rem;padding-bottom:2.25rem}.hero-h1{font-size:36px}.hero-mark{font-size:14px}.hero-sub-copy{font-size:15.5px}.hero-cta{font-size:15px;letter-spacing:.02em}.hero-cta-icon{width:1.25rem;height:1.25rem}}
      }
    </style>
  </head>
  <body class="bg-[#08070B] text-white antialiased selection:bg-[#E12687]/35 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
